<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing:border-box;
}
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    color: #333;
}
header {
    background-color: #222;
    color:white;
    text-align: center;
    padding: 25px;
}
nav {
    background-color: #444;
    padding: 10px;
    text-align: center;
}
nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}
nav a:hover {    
    color:#00bcd4;
}
.container {
    display: flex;
    gap: 20px;
    padding: 20px;
    min-height: 400px;
}
aside {
    width: 25%;
    background-color: #ddd;
    padding: 20px;
    border-radius: 5px;
}
main {
    flex: 1;
    background-color:antiquewhite;
    padding: 20px;
    border-radius: 5px;
}
footer {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
}
@media (max-width: 600px) {
    .container {
        flex-direction: column;
    }
    aside {
        width: 100%;
    }
    nav a {
        display: inline-block;
        margin: 5px;
    }
}
</style>
</head>
<body>
    <header>
        <h1>Entre em Contato Conosco</h1>
    </header>
    <nav>
        <a href="index.html">Início</a>
    </nav>
    <main>
        <section class="container">
            <aside>
                <p>Estamos à disposição para esclarecer dúvidas, receber sugestões e atender às suas necessidades. Entre em contato conosco através dos canais abaixo:</p>
            </aside>
            <article>
                <h2>Formulário de Contato</h2>
                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" required></textarea>
                    <button type="submit">Enviar</button>
                </form>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Nexus Inovação Digital. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
